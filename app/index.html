<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight · <span class="updated" aria-live="off"></span></p>
    </header>
    <main data-testid="board" aria-busy="true">
      <p data-testid="loader" class="loader" role="status">Loading incidents…</p>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <div class="error-slot"><p data-testid="error" class="error" role="alert" hidden></p></div>
      <div class="new-slot" aria-live="polite">
        <button type="button" data-testid="new-bar" class="new-bar" hidden></button>
      </div>
      <ul data-testid="incident-list" class="list"></ul>
    </main>
    <footer>sched-prod incident board · build <code data-testid="build-sha">__BUILD_SHA__</code></footer>
  </body>
</html>
